<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenAPI Visualizer</title>
    <link rel="stylesheet" href="/styles.css">
    <script defer src="https://unpkg.com/cytoscape@3.29.2/dist/cytoscape.min.js"></script>
    <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script defer src="/app.js"></script>
</head>
<body>
    <main class="app-shell">
        <aside class="sidebar">
            <section class="brand-row">
                <div>
                    <h1>OpenAPI Visualizer</h1>
                    <p id="specMeta">No spec loaded</p>
                </div>
            </section>

            <section class="import-panel">
                <label class="file-input">
                    <i data-lucide="file-json"></i>
                    <span id="fileLabel">Load JSON spec</span>
                    <input id="fileInput" type="file" accept=".json,application/json">
                </label>
                <button id="compareButton" class="compare-button hidden" type="button">
                    <i data-lucide="git-compare-arrows"></i>
                    <span id="compareLabel">View diff</span>
                </button>
                <input id="compareFileInput" type="file" accept=".json,application/json" hidden>
            </section>

            <section class="repo-panel collapsible-section" data-section="repo" id="repoPanel" hidden>
                <button class="section-title section-toggle" type="button" data-toggle-section="repo" aria-expanded="true">
                    <span>Diff from repository</span>
                    <span class="section-meta">
                        <i data-lucide="chevron-down"></i>
                    </span>
                </button>
                <div class="section-body repo-body">
                    <select id="diffSourceSelect" class="repo-select" aria-label="Spec source"></select>

                    <div class="repo-row">
                        <input id="prInput" type="number" min="1" step="1" placeholder="Pull request number" autocomplete="off">
                        <button id="prLoadButton" class="repo-button" type="button" title="Diff this pull request">
                            <i data-lucide="git-pull-request-arrow"></i>
                        </button>
                    </div>

                    <div class="repo-row repo-row-refs">
                        <input id="baseRefInput" type="text" placeholder="base ref" autocomplete="off">
                        <input id="headRefInput" type="text" placeholder="head ref" autocomplete="off">
                        <button id="refLoadButton" class="repo-button" type="button" title="Diff these two refs">
                            <i data-lucide="git-compare-arrows"></i>
                        </button>
                    </div>

                    <p id="repoStatus" class="repo-status hidden"></p>
                    <div id="diffProvenance" class="diff-provenance hidden"></div>
                </div>
            </section>

            <section class="search-panel">
                <div class="search-row">
                    <div class="search-box">
                        <i data-lucide="search"></i>
                        <input id="endpointSearch" type="search" placeholder="Search endpoints or models" autocomplete="off">
                    </div>
                    <button id="methodFiltersToggle" class="icon-button filter-toggle collapsed" title="Show method filters" aria-label="Show method filters" aria-expanded="false">
                        <i data-lucide="chevron-down"></i>
                    </button>
                </div>
                <div class="method-row collapsed" id="methodFilters">
                    <button class="method-filter active" data-method="">All</button>
                    <button class="method-filter get" data-method="GET">GET</button>
                    <button class="method-filter post" data-method="POST">POST</button>
                    <button class="method-filter put" data-method="PUT">PUT</button>
                    <button class="method-filter patch" data-method="PATCH">PATCH</button>
                    <button class="method-filter delete" data-method="DELETE">DEL</button>
                </div>
            </section>

            <section class="favorite-section collapsible-section" data-section="favorites">
                <button class="section-title section-toggle" type="button" data-toggle-section="favorites" aria-expanded="true">
                    <span>Favorites</span>
                    <span class="section-meta">
                        <span id="favoriteCount">0</span>
                        <i data-lucide="chevron-down"></i>
                    </span>
                </button>
                <div id="favoriteList" class="endpoint-list section-body"></div>
            </section>

            <section class="endpoint-section collapsible-section" data-section="endpoints">
                <button class="section-title section-toggle" type="button" data-toggle-section="endpoints" aria-expanded="true">
                    <span>Endpoints</span>
                    <span class="section-meta">
                        <span id="endpointCount">0</span>
                        <i data-lucide="chevron-down"></i>
                    </span>
                </button>
                <div id="endpointList" class="endpoint-list section-body"></div>
            </section>

            <section class="model-section collapsible-section" data-section="models">
                <button class="section-title section-toggle" type="button" data-toggle-section="models" aria-expanded="true">
                    <span>Models</span>
                    <span class="section-meta">
                        <span id="modelCount">0</span>
                        <i data-lucide="chevron-down"></i>
                    </span>
                </button>
                <div class="section-body model-browser">
                    <div class="model-tabs" role="tablist" aria-label="Model browser">
                        <button class="model-tab active" type="button" data-model-tab="all">Models</button>
                        <button class="model-tab" type="button" data-model-tab="changed">Changed</button>
                        <button class="model-tab" type="button" data-model-tab="affected">Affected</button>
                    </div>
                    <div id="modelList" class="model-list"></div>
                </div>
            </section>

            <section id="changedEndpointSection" class="changed-section collapsible-section hidden" data-section="changed">
                <button class="section-title section-toggle" type="button" data-toggle-section="changed" aria-expanded="true">
                    <span>Changed endpoints</span>
                    <span class="section-meta">
                        <span id="changedEndpointCount">0</span>
                        <i data-lucide="chevron-down"></i>
                    </span>
                </button>
                <div id="changedEndpointList" class="endpoint-list section-body"></div>
            </section>

            <section id="affectedEndpointSection" class="affected-section collapsible-section hidden" data-section="affected">
                <button class="section-title section-toggle" type="button" data-toggle-section="affected" aria-expanded="true">
                    <span>Affected endpoints</span>
                    <span class="section-meta">
                        <span id="affectedEndpointCount">0</span>
                        <i data-lucide="chevron-down"></i>
                    </span>
                </button>
                <div id="affectedEndpointList" class="endpoint-list section-body"></div>
            </section>

            <section class="selected-section collapsible-section" data-section="selected">
                <div class="section-title">
                    <button class="section-toggle selected-toggle" type="button" data-toggle-section="selected" aria-expanded="true">
                        <span>Selected</span>
                        <span class="section-meta">
                            <span id="selectedCount">0</span>
                            <i data-lucide="chevron-down"></i>
                        </span>
                    </button>
                    <button id="clearSelection" class="icon-button" title="Clear selection" aria-label="Clear selection">
                        <i data-lucide="x"></i>
                    </button>
                </div>
                <div id="selectedList" class="selected-list section-body"></div>
            </section>
        </aside>

        <div class="resize-handle resize-handle-left" data-resize-panel="left" role="separator" aria-orientation="vertical" aria-label="Resize left panel"></div>

        <section class="graph-panel">
            <div class="graph-toolbar">
                <div class="toolbar-group">
                    <label for="depthInput">Depth</label>
                    <select id="depthInput">
                        <option value="all">All reachable</option>
                        <option value="4" selected>4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </div>
                <div class="toolbar-group">
                    <label for="nodeLimitInput">Nodes</label>
                    <input id="nodeLimitInput" type="number" min="25" max="1000" step="25" value="250">
                </div>
                <button id="layoutButton" class="tool-button" title="Recalculate layout">
                    <i data-lucide="refresh-cw"></i>
                    <span>Layout</span>
                </button>
                <button id="fitButton" class="tool-button" title="Fit graph">
                    <i data-lucide="maximize"></i>
                    <span>Fit</span>
                </button>
                <button id="showChangesButton" class="tool-button hidden" title="Show all changed and affected endpoints and models">
                    <i data-lucide="list-plus"></i>
                    <span>Changes</span>
                </button>
                <div class="status-pill" id="graphStatus">Idle</div>
                <div class="settings-menu">
                    <button id="settingsButton" class="icon-button" title="Graph settings" aria-label="Graph settings" aria-expanded="false">
                        <i data-lucide="settings"></i>
                    </button>
                    <div id="settingsPanel" class="settings-panel hidden">
                        <label class="check-control">
                            <input id="hideEnumsInput" type="checkbox" checked>
                            <span>Hide enums</span>
                        </label>
                        <label class="check-control">
                            <input id="hideErrorResponsesInput" type="checkbox" checked>
                            <span>Hide error responses</span>
                        </label>
                        <label class="check-control">
                            <input id="showOnlyChangedInput" type="checkbox" checked disabled>
                            <span>Show only changed</span>
                        </label>
                        <label class="range-control">
                            <span>Horizontal gap <strong id="horizontalGapValue">1.4</strong></span>
                            <input id="horizontalGapInput" type="range" min="0.8" max="2.8" step="0.1" value="1.4">
                        </label>
                        <label class="range-control">
                            <span>Vertical gap <strong id="verticalGapValue">1.4</strong></span>
                            <input id="verticalGapInput" type="range" min="0.8" max="2.8" step="0.1" value="1.4">
                        </label>
                        <label class="range-control">
                            <span>Node width <strong id="nodeWidthValue">1.0</strong></span>
                            <input id="nodeWidthInput" type="range" min="0.8" max="2.4" step="0.1" value="1">
                        </label>
                        <label class="range-control">
                            <span>Node height <strong id="nodeHeightValue">1.0</strong></span>
                            <input id="nodeHeightInput" type="range" min="0.8" max="2.0" step="0.1" value="1">
                        </label>
                        <label class="range-control">
                            <span>Node text <strong id="nodeTextSizeValue">1.0</strong></span>
                            <input id="nodeTextSizeInput" type="range" min="0.8" max="1.8" step="0.1" value="1">
                        </label>
                        <label class="range-control">
                            <span>Edge text <strong id="edgeTextSizeValue">1.0</strong></span>
                            <input id="edgeTextSizeInput" type="range" min="0.8" max="2.0" step="0.1" value="1">
                        </label>
                        <button id="resetSettingsButton" class="settings-reset" type="button">Reset to defaults</button>
                    </div>
                </div>
            </div>
            <div id="graph"></div>
            <div id="emptyGraph" class="empty-state">Select endpoints</div>
            <button id="detailsExpandButton" class="details-expand-button hidden" type="button" title="Show details" aria-label="Show details">
                <i data-lucide="chevron-left"></i>
            </button>
        </section>

        <div class="resize-handle resize-handle-right" data-resize-panel="right" role="separator" aria-orientation="vertical" aria-label="Resize right panel"></div>

        <aside class="details-panel">
            <div class="details-header">
                <div class="details-title-group">
                    <h2 id="detailsTitle">Details</h2>
                    <span id="detailsBadge"></span>
                </div>
                <button id="detailsCollapseButton" class="icon-button" type="button" title="Collapse details" aria-label="Collapse details">
                    <i data-lucide="chevron-right"></i>
                </button>
            </div>
            <div id="detailsBody" class="details-body"></div>
        </aside>
    </main>

    <div id="schemaExplorerOverlay" class="schema-explorer-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="schemaExplorerTitle">
        <div class="schema-explorer-dialog" role="document">
            <div class="schema-explorer-header">
                <div class="schema-explorer-title-group">
                    <h2 id="schemaExplorerTitle">Model details</h2>
                    <span id="schemaExplorerBadge"></span>
                </div>
                <button id="schemaExplorerCloseButton" class="icon-button" type="button" title="Close model details" aria-label="Close model details">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div id="schemaExplorerBody" class="schema-explorer-body"></div>
        </div>
    </div>

    <div id="similarModelsOverlay" class="similar-models-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="similarModelsTitle">
        <div class="similar-models-dialog" role="document">
            <div class="similar-models-header">
                <div class="schema-explorer-title-group">
                    <h2 id="similarModelsTitle">Similar models</h2>
                    <span id="similarModelsBadge"></span>
                </div>
                <button id="similarModelsCloseButton" class="icon-button" type="button" title="Close similar models" aria-label="Close similar models">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div id="similarModelsBody" class="similar-models-body"></div>
        </div>
    </div>
</body>
</html>
